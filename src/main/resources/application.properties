server.port=8080

spring.application.name=contacts

spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:contacts}
spring.datasource.username=${PG_USER:dev}
spring.datasource.password=${PG_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:Xw/fsgaKSCssUl+BmShpapqxjxMovGr3mM3VCE4D/ZAK8rLV3KxIJlUecWXjHygZoMTikONy5R8XgICDMUAfGQ==}
jwt.expiration=3600000

address.lookup.viacep-base-url=https://viacep.com.br/ws

address.lookup.google-geocoding-url=https://maps.googleapis.com/maps/api/geocode/json
address.lookup.google-api-key=${APIKEY}

spring.cache.type=simple

logging.level.com.uex.contacts.config=DEBUG
logging.level.com.uex.contacts=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.web.servlet=DEBUG
