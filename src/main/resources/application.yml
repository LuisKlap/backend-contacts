spring:
  application:
    name: contacts

  datasource:
    url: jdbc:postgresql://localhost:5432/contacts
    username: dev
    password: dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Configuração de Email (SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@contatos.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

jwt:
  secret: "troque-por-um-secret-real"
  expiration: 3600000  # 1 hora em ms
  refresh-expiration: 604800000  # 7 dias em ms

cors:
  allowed-origins: "https://front-contacts.vercel.app,http://localhost:3000,http://localhost:4200"

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_EXPIRATION:30}
  scheduling:
    cleanup-expired-tokens: ${CLEANUP_CRON:0 0 2 * * *}  # Diariamente às 2h

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
