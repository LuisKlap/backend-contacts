spring:
  application:
    name: contacts

  datasource:
    url: jdbc:postgresql://localhost:5432/contacts
    username: dev
    password: dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: "troque-por-um-secret-real"
  expiration: 3600000

cors:
  allowed-origins: "https://front-contacts.vercel.app,http://localhost:3000,http://localhost:4200"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
